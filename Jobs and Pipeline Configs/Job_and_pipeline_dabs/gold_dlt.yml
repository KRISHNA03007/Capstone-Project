resources:
  pipelines:
    pipeline_gold_dlt:
      name: Gold DLT
      clusters:
        - label: default
          node_type_id: Standard_D4a_v4
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: local[*]
          custom_tags:
            ResourceClass: SingleNode
      libraries:
        - glob:
            include: ../../GoldLayer/MaterializedViews/**
        - glob:
            include: ../../GoldLayer/StarSchema/DimensionTables/**
        - glob:
            include: ../../GoldLayer/StarSchema/FactTables/**
      catalog: ${var.catalog_name}
      schema: gold
