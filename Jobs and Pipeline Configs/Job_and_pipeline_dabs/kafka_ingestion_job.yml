resources:
  jobs:
    Kafka_Ingestion_Job:
      name: Kafka Ingestion Job
      continuous:
        pause_status: PAUSED
        task_retry_mode: ON_FAILURE
      tasks:
        - task_key: Ingest_Kafka_Inventory
          notebook_task:
            notebook_path: /Workspace/Users/srushtibhujade77@outlook.com/Capstone-Project/kafka_ingestion/kafka_inventory_bronze_ingestion
            source: WORKSPACE
          job_cluster_key: job_cluster
        - task_key: Ingest_Kafka_Orders
          notebook_task:
            notebook_path: /Workspace/Users/srushtibhujade77@outlook.com/Capstone-Project/kafka_ingestion/kafka_orders_bronze_ingestion
            source: WORKSPACE
          job_cluster_key: job_cluster
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_D4a_v4
            data_security_mode: DATA_SECURITY_MODE_AUTO
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            use_ml_runtime: false
            is_single_node: true
      queue:
        enabled: true
