resources:
  jobs:
    Kafka_Ingestion_Job:
      name: Kafka Ingestion Job
      continuous:
        pause_status: PAUSED
      tasks:
        - task_key: Ingest_Kafka_Inventory
          notebook_task:
            notebook_path: ../../kafka_ingestion/kafka_inventory_bronze_ingestion.ipynb
          job_cluster_key: job_cluster
        - task_key: Ingest_Kafka_Orders
          notebook_task:
            notebook_path: ../../kafka_ingestion/kafka_orders_bronze_ingestion.ipynb
          job_cluster_key: job_cluster
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_D4a_v4
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 1
      queue:
        enabled: true

